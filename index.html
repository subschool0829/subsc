<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>入退室｜みんなのサブスク</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --paper:#EEF4FA; --grid:#D6E3F1; --ink:#1B2B4B; --sub:#5A6B89;
    --in:#169B6B; --out:#E9861C; --err:#C93C3C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:4vw;align-items:center;padding:4vh 5vw}
  @media (orientation:portrait){.wrap{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:center;gap:4vh}}
  .cam{position:relative;aspect-ratio:1/1;width:100%;max-height:82vh;margin:auto;border-radius:36px;overflow:hidden;background:#0d1626;box-shadow:0 0 0 10px #fff}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  .frame{position:absolute;inset:16%;pointer-events:none}
  .frame i{position:absolute;width:22%;height:22%;border:7px solid #fff;opacity:.9}
  .frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
  .frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
  .frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
  .frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:flash .45s ease-out}
  @keyframes flash{from{opacity:.95}to{opacity:0}}
  .side{text-align:left}
  .clock{font-size:clamp(56px,11vw,140px);font-weight:900;letter-spacing:.02em;line-height:1}
  .date{font-size:clamp(18px,2.4vw,30px);color:var(--sub);margin-top:1vh;font-weight:700}
  .guide{margin-top:5vh;font-size:clamp(24px,3.6vw,46px);font-weight:900;line-height:1.35}
  .guide small{display:block;font-size:.5em;font-weight:700;color:var(--sub);margin-top:1.2vh}
  .brand{position:fixed;left:5vw;bottom:2.5vh;font-weight:700;color:var(--sub);font-size:clamp(14px,1.6vw,20px)}

  /* 結果画面 */
  .overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:5vh 6vw}
  .overlay.show{display:flex}
  .overlay.in{background:var(--in)} .overlay.out{background:var(--out)} .overlay.err{background:var(--err)}
  .overlay.wait{background:rgba(27,43,75,.88)}
  .overlay .msg{font-size:clamp(28px,5vw,64px);font-weight:900}
  .overlay .name{font-size:clamp(56px,11vw,150px);font-weight:900;line-height:1.15;margin:2vh 0;word-break:keep-all}
  .overlay .meta{font-size:clamp(22px,3.4vw,44px);font-weight:700;opacity:.95}
  .overlay .note{font-size:clamp(14px,1.8vw,22px);margin-top:3vh;opacity:.9}
  .overlay.show .name{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .count{width:clamp(90px,14vw,170px);aspect-ratio:1;border-radius:50%;border:10px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin 1s linear infinite;margin-bottom:3vh}
  @keyframes spin{to{transform:rotate(360deg)}}

  .start{position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:6vw}
  .start h1{font-size:clamp(28px,4.5vw,56px);font-weight:900}
  .start button{font:inherit;font-size:clamp(22px,3vw,36px);font-weight:900;color:var(--ink);background:#fff;border:0;border-radius:999px;padding:2.4vh 6vw;cursor:pointer}
  .start button:focus-visible{outline:4px solid #8fc1ff;outline-offset:4px}
  .start p{color:#c9d4e6;font-size:clamp(14px,1.8vw,20px);line-height:1.7;max-width:40em}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* おうちの人へのメッセージ */
  .msgbtns{display:flex;flex-wrap:wrap;gap:1.2vw;margin-top:4vh}
  .msgbtn{margin-top:0;font:inherit;font-weight:900;font-size:clamp(14px,1.8vw,22px);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:999px;padding:1.3vh 2.2vw;cursor:pointer}
  .msgbtn:active{transform:translateY(2px)}
  .msgbar{position:fixed;left:0;right:0;top:0;display:none;align-items:center;justify-content:center;gap:3vw;background:#2F6FDB;color:#fff;padding:2.4vh 4vw;font-weight:900;font-size:clamp(20px,3vw,38px);z-index:20}
  .msgbar.show{display:flex}
  .msgbar button,.compose button{font:inherit;font-weight:900;border:0;border-radius:999px;cursor:pointer}
  .msgbar button{font-size:clamp(14px,1.8vw,22px);padding:1vh 2.6vw;background:#fff;color:#2F6FDB}
  .compose{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--paper);padding:4vh 5vw;z-index:30;gap:2vh}
  .compose.show{display:flex}
  .compose h2{font-size:clamp(22px,3.4vw,42px);font-weight:900;text-align:center;line-height:1.4}
  .compose textarea{width:100%;max-width:900px;height:28vh;font:inherit;font-size:clamp(18px,2.4vw,28px);font-weight:700;padding:2vh 2vw;border:3px solid var(--ink);border-radius:20px;resize:none;background:#fff;color:var(--ink)}
  .compose .row{display:flex;gap:3vw;width:100%;max-width:900px;justify-content:flex-end;align-items:center}
  .compose .cnt{margin-right:auto;color:var(--sub);font-weight:700;font-size:clamp(14px,1.6vw,20px)}
  .compose .send{font-size:clamp(20px,2.6vw,32px);padding:1.6vh 5vw;background:#2F6FDB;color:#fff}
  .compose .send:disabled{opacity:.4}
  .compose .cancel{font-size:clamp(18px,2.2vw,26px);padding:1.6vh 3.5vw;background:#fff;color:var(--ink);border:3px solid var(--ink)}
  /* 教室からのメッセージ・カウントダウン */
  .guiderow{display:flex;gap:2.4vw;align-items:center;margin-top:4vh}
  .guiderow .guide{margin-top:0}
  .cds{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
  .cds:empty{display:none}
  .cd{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:1vh 1.4vw;line-height:1.25}
  .cd .lb{display:block;font-size:clamp(12px,1.5vw,20px);font-weight:700;color:var(--sub)}
  .cd .dd{font-size:clamp(14px,1.7vw,22px);font-weight:900;white-space:nowrap}
  .cd .dd b{font-size:clamp(26px,3.6vw,48px);font-weight:900;margin:0 .15em;color:#2F6FDB}
  .board{margin-top:2.6vh;background:#FFF5CC;border-left:8px solid #F7CE2E;border-radius:14px;padding:1.4vh 1.6vw;font-weight:700;font-size:clamp(15px,1.9vw,24px);line-height:1.5;white-space:pre-wrap;max-height:22vh;overflow:hidden}
  .board small{display:block;font-size:.7em;color:var(--sub);margin-bottom:.3vh}
  .board[hidden]{display:none}
  /* 画面に収まるように調整 */
  .clock{font-size:clamp(44px,7vw,100px)}
  .guiderow{margin-top:2.6vh}
  .guiderow .guide{font-size:clamp(20px,2.7vw,38px);white-space:nowrap}
  .guiderow .guide small{white-space:normal}
  .cd .lb{white-space:nowrap}
  .toprow{display:flex;gap:2vw;align-items:stretch}
  .toprow .clk{flex:none}
  .board{margin-top:0;flex:1 1 auto;min-width:0;height:clamp(90px,17vh,150px);font-size:clamp(13px,1.45vw,19px);line-height:1.45;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  .board.none span{color:var(--sub);font-weight:500}
  .msgbtns{margin-top:2.2vh}
  /* ゲストの入退室 */
  .msgbtn.guest{background:#1B2B4B;color:#fff;border-color:#1B2B4B}
  .gpanel{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:var(--paper);padding:4vh 5vw;z-index:30;gap:2.4vh;overflow:auto}
  .gpanel.show{display:flex}
  .gpanel h2{font-size:clamp(22px,3.4vw,42px);font-weight:900;text-align:center;line-height:1.4}
  .gpanel .gnote{font-size:clamp(14px,1.8vw,22px);font-weight:700;color:var(--sub);text-align:center}
  .gpanel .ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2vw;width:100%;max-width:900px}
  .gpanel .ggrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gpanel .ggrid button,.gpanel .gbig{font:inherit;font-weight:900;font-size:clamp(20px,2.8vw,34px);padding:3vh 1vw;border-radius:22px;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  .gpanel .ggrid button.in{background:var(--in);border-color:var(--in);color:#fff}
  .gpanel .ggrid button.out{background:var(--out);border-color:var(--out);color:#fff}
  .gpanel .glist{display:flex;flex-direction:column;gap:1.4vh;width:100%;max-width:900px}
  .gpanel .glist button{font:inherit;font-weight:900;font-size:clamp(18px,2.4vw,30px);padding:2vh 2vw;border-radius:18px;border:3px solid var(--ink);background:#fff;color:var(--ink);text-align:left;cursor:pointer}
  .gpanel .glist button small{font-size:.6em;color:var(--sub);margin-left:1em}
  .gpanel input{width:100%;max-width:900px;font:inherit;font-size:clamp(22px,3vw,36px);font-weight:700;padding:2vh 2vw;border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);box-sizing:border-box}
  .gpanel .row{display:flex;gap:3vw;width:100%;max-width:900px;justify-content:flex-end;align-items:center}
  .gpanel .row button{font:inherit;font-weight:900;border-radius:999px;cursor:pointer;font-size:clamp(18px,2.2vw,26px);padding:1.6vh 3.5vw;background:#fff;color:var(--ink);border:3px solid var(--ink)}
  .gpanel .row button.next{background:#2F6FDB;color:#fff;border-color:#2F6FDB}
  .gpanel .row button:disabled{opacity:.4}
  .gbar{position:fixed;left:0;right:0;top:0;display:none;flex-direction:column;align-items:center;gap:.6vh;background:#1B2B4B;color:#fff;padding:2vh 4vw;z-index:20;text-align:center}
  .gbar.show{display:flex}
  .overlay .note{white-space:pre-line}
  .gbar b{font-size:clamp(20px,3vw,38px);font-weight:900}
  .gbar span{font-size:clamp(14px,1.8vw,22px);font-weight:700;opacity:.9}
  .gbar button{font:inherit;font-weight:900;border:0;border-radius:999px;cursor:pointer;font-size:clamp(14px,1.8vw,22px);padding:.8vh 2.6vw;background:#fff;color:#1B2B4B;margin-top:.6vh}
</style>
</head>
<body>
<div class="wrap">
  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="side">
    <div class="toprow"><div class="clk"><div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div></div>
    <div class="board" id="board"><small>教室からのメッセージ</small><span id="boardText">本日は特別なメッセージはありません</span></div></div>
    <div class="guiderow"><div class="guide">QRコードを<br>カメラにかざしてね<small>入るときも、帰るときも同じカードでOK</small></div><div class="cds" id="cds"></div></div>
    <div class="msgbtns"><button class="msgbtn guest" id="guestBtn" type="button">ゲストの方はこちら</button><button class="msgbtn" id="msgBtn" type="button">おうちの人にメッセージを送る</button><button class="msgbtn" id="msgBtnS" type="button">Seiwaにメッセージを送る</button><button class="msgbtn" id="msgBtnK" type="button">Kentoにメッセージを送る</button></div>
  </div>
</div>
<div class="brand">みんなのサブスク</div>

<div class="gpanel" id="gPanel"></div>
<div class="gbar" id="gBar"><b id="gBarTitle">顔が見えるように写真に写ってください</b><span>ゲスト用のQRコードをカメラにかざしてね</span><span>※休会生・ビジターは30分以上の滞在で有料になります</span><button type="button" id="gBarCancel">キャンセル</button></div>

<div class="msgbar" id="msgBar"><span id="msgBarText">メッセージを送る人のQRコードをかざしてね</span><button type="button" id="msgBarCancel">キャンセル</button></div>

<div class="compose" id="compose">
  <h2 id="cTitle"></h2>
  <textarea id="cText" maxlength="300" placeholder="ここにメッセージを書いてね"></textarea>
  <div class="row">
    <span class="cnt" id="cCount">0 / 300</span>
    <button type="button" class="cancel" id="cCancel">キャンセル</button>
    <button type="button" class="send" id="cSend" disabled>送信</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="count" id="spinner" hidden></div>
  <div class="msg" id="oMsg"></div>
  <div class="name" id="oName"></div>
  <div class="meta" id="oMeta"></div>
  <div class="note" id="oNote"></div>
</div>

<div class="start" id="start">
  <h1>入退室受付</h1>
  <button id="startBtn">受付をはじめる</button>
  <p id="startNote">ボタンを押すとカメラが起動します。カメラの使用を確認されたら「許可」を選んでください。</p>
</div>

<script>
  // Google側（記録・LINE通知）の窓口
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwoPiOpPmUcykIrgUGYj5f0z1jnPA6gH3cU2aUDsqSLVKlAB9CytbtpYb8iqHAS81kQ-g/exec';
  // 教室専用の鍵は URL の「#k=…」で受け取る（ページ本体には書かない）
  var KEY = (location.hash.match(/k=([0-9a-f]+)/) || [])[1] || '';
  try {
    if (KEY) localStorage.setItem('subsc_key', KEY); else KEY = localStorage.getItem('subsc_key') || '';
  } catch(e){}
  if (!KEY) {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('startNote').textContent = 'このURLでは受付できません。管理者から渡された専用のURLで開いてください。';
  }
  var video = document.getElementById('video');
  var work = document.createElement('canvas');
  var detector = null, busy = false, lastText = '', lastTime = 0, wakeLock = null;

  // 時計
  var WD = ['日','月','火','水','木','金','土'];
  function tick(){
    var d = new Date();
    document.getElementById('clock').textContent = d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
    document.getElementById('date').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）';
  }
  tick(); setInterval(tick, 5000);

  document.getElementById('startBtn').onclick = start;

  function start(){
    var note = document.getElementById('startNote');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      note.textContent = 'このブラウザではカメラを使えません。AndroidのChromeで開いてください。';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false })
      .then(function(stream){
        video.srcObject = stream;
        return video.play();
      })
      .then(function(){
        document.getElementById('start').style.display = 'none';
        try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){}); } catch(e){}
        keepAwake();
        if ('BarcodeDetector' in window) {
          try { detector = new BarcodeDetector({ formats:['qr_code'] }); } catch(e){ detector = null; }
        }
        scanLoop();
      })
      .catch(function(err){
        note.textContent = 'カメラを起動できませんでした（' + err.name + '）。Chromeのサイト設定でカメラを「許可」にして、ページを開き直してください。';
      });
  }

  function keepAwake(){
    try {
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }).catch(function(){});
    } catch(e){}
  }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') keepAwake(); });

  function scanLoop(){
    if (busy || video.readyState < 2) { setTimeout(scanLoop, 250); return; }
    if (detector) {
      detector.detect(video).then(function(codes){
        if (codes && codes.length) near(codes[0].rawValue, codes[0].boundingBox ? codes[0].boundingBox.width / (video.videoWidth || 1) : 1); else near('', 0);
      }).catch(function(){ detector = null; }).then(function(){ setTimeout(scanLoop, 200); });
    } else {
      var w = 480, h = Math.round(video.videoHeight * w / video.videoWidth) || 360;
      work.width = w; work.height = h;
      var ctx = work.getContext('2d', { willReadFrequently:true });
      ctx.drawImage(video, 0, 0, w, h);
      var img = ctx.getImageData(0, 0, w, h);
      var code = window.jsQR ? jsQR(img.data, w, h, { inversionAttempts:'dontInvert' }) : null;
      if (code && code.data) { var L = code.location; near(code.data, L ? Math.abs(L.topRightCorner.x - L.topLeftCorner.x) / w : 1); } else near('', 0);
      setTimeout(scanLoop, 200);
    }
  }

  // 近くでかざしたQRだけ読む（遠くに写りこんだカード・紙のQRで勝手に打刻されないように）
var MIN_QR_RATIO = 0.15; // 画面の幅に対するQRの大きさ（これより小さい＝遠いものは無視）
var candText = '', candCount = 0;
function near(text, ratio){
  if (!text || ratio < MIN_QR_RATIO) { candText = ''; candCount = 0; return; }
  if (text === candText) candCount++; else { candText = text; candCount = 1; }
  if (candCount >= 2) { candCount = 0; onCode(text); }
}
// ===== すぐ表示：名簿と在室状態を手元に持っておき、送信は裏で行う =====
var ROSTER = null, rosterAt = 0;
function loadRoster(){
  if (!KEY) return;
  var started = Date.now();
  fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'kiosk_roster', key:KEY }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (!r || !r.ok) return;
      var old = ROSTER, R = { s:{}, m:{} };
      var put = function(map, a, oldMap){
        a.forEach(function(x){
          var o = oldMap && oldMap[x[0]];
          // 読み込み中に受付した人は、手元の状態を優先
          if (o && o.touched && o.touched > started - 120000) { map[x[0]] = o; return; }
          map[x[0]] = { name: x[1], in: !!x[2], last: x[3] || 0 };
        });
      };
      put(R.s, r.students || [], old && old.s);
      put(R.m, r.mentors || [], old && old.m);
      ROSTER = R; rosterAt = Date.now();
    }).catch(function(){});
}
loadRoster();
setInterval(loadRoster, 3 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && Date.now() - rosterAt > 60000) loadRoster(); });

function hm(){ var d = new Date(); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
function warn(t){
  var w = document.getElementById('kwarn');
  if (!w) {
    w = document.createElement('div'); w.id = 'kwarn';
    w.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:50;background:#B3261E;color:#fff;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.25)';
    w.onclick = function(){ w.remove(); };
    document.body.appendChild(w);
  }
  var p = document.createElement('div'); p.textContent = '⚠ ' + t + '（先生に知らせてください／タップで消えます）';
  w.appendChild(p);
}
// 裏で送る（失敗したら何回かやり直す）
function sendBg(text, photo, ent, act, tries){
  tries = tries || 0;
  fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'checkin', key:KEY, qr:text, photo:photo }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (!r || !r.ok) { warn(ent.name + 'さんの' + act + 'を記録できませんでした：' + ((r && r.message) || 'エラー')); ent.in = act !== '入室'; return; }
      if (r.action) ent.in = r.action === '入室';
      if (r.action && r.action !== act) warn(ent.name + 'さんは「' + r.action + '」として記録されています');
    })
    .catch(function(){
      if (tries < 3) setTimeout(function(){ sendBg(text, photo, ent, act, tries + 1); }, [4000, 10000, 20000][tries]);
      else warn(ent.name + 'さんの' + act + 'を記録できませんでした（通信エラー）');
    });
}

function onCode(text){
    if (busy) return;
    if (guestMode) { guestCode(text); return; }
    if (msgMode) { msgCode(text); return; }
    if (text.trim() === 'SUBSC:GUEST') { busy = true; beep(660, .2); show('err', 'ゲストの方へ', '', '先に「ゲストの方はこちら」を押してね', ''); setTimeout(reset, 3000); return; }
    var now = Date.now();
    if (text === lastText && now - lastTime < 6000) return;
    lastText = text; lastTime = now;
    if (text.indexOf('SUBSC:') !== 0) {
      busy = true; beep(220, .25);
      show('err', 'このQRコードは使えません', '', '教室のカードをかざしてね', '');
      setTimeout(reset, 2500);
      return;
    }
    var id = text.slice(6).trim(), isM = /^M\d+$/.test(id);
    var ent = ROSTER && (isM ? ROSTER.m[id] : ROSTER.s[id]);
    if (ent) {
      busy = true; beep(880, .12);
      if (Date.now() - ent.last < 60000) {
        beep(660, .15);
        show(ent.in ? 'in' : 'out', 'もう受付ずみです', ent.name + 'さん', (ent.in ? '入室' : '退室') + 'は記録されています', '');
        setTimeout(reset, 2500);
        return;
      }
      var nd = new Date(), late = nd.getHours() * 100 + nd.getMinutes() >= 2330;
      var act = (ent.in || (!isM && late)) ? '退室' : '入室'; // 23:30以降、生徒は退室として記録
      var done = function(photo){
        ent.in = act === '入室'; ent.last = Date.now(); ent.touched = Date.now();
        if (isM) {
          chime(act === '入室');
          show(act === '入室' ? 'in' : 'out', act === '入室' ? '出勤しました' : 'おつかれさまでした', ent.name + 'さん', (act === '入室' ? '出勤 ' : '退勤 ') + hm(), act === '入室' ? 'よろしくお願いします' : '');
        } else {
          chime(act === '入室');
          show(act === '入室' ? 'in' : 'out', act === '入室' ? 'ようこそ！' : 'おつかれさま！', ent.name + 'さん', act + ' ' + hm(), act === '入室' ? 'おうちの人に知らせるね' : '気をつけて帰ってね');
        }
        setTimeout(reset, 3000);
        sendBg(text, photo, ent, act);
      };
      if (isM) { done(''); return; }
      show('wait', 'そのまま カメラを見てね', '', '', '', true);
      setTimeout(function(){ done(capture()); }, 800);
      return;
    }
    busy = true; beep(880, .12);
    show('wait', 'そのまま カメラを見てね', '', '', '', true);
    setTimeout(function(){
      var photo = capture();
      document.getElementById('oMsg').textContent = '送信中…';
      fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'checkin', key:KEY, qr:text, photo:photo }) })
        .then(function(r){ return r.json(); })
        .then(result)
        .catch(function(){
          beep(220, .3);
          show('err', '通信できませんでした', '', 'もう一度かざしてください', '');
          lastText = '';
          setTimeout(reset, 3000);
        });
    }, 900);
  }

  function capture(){
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw) return '';
    var w = 640, h = Math.round(vh * w / vw);
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    ctx.drawImage(video, 0, 0, w, h);
    var f = document.getElementById('flash');
    f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    return c.toDataURL('image/jpeg', 0.72);
  }

  function result(r){
    if (!r || !r.ok) {
      beep(220, .3);
      show('err', (r && r.message) || 'エラーが起きました', '', '先生に声をかけてください', '');
    } else if (r.mentor && !r.duplicate) {
      chime(r.kind === '出勤');
      show(r.kind === '出勤' ? 'in' : 'out', r.kind === '出勤' ? '出勤しました' : 'おつかれさまでした', r.name + 'さん', r.kind + ' ' + r.time, r.kind === '出勤' ? 'よろしくお願いします' : '');
    } else if (r.duplicate) {
      beep(660, .15);
      show(r.action === '入室' ? 'in' : 'out', 'もう受付ずみです', r.name + 'さん', r.action + 'は記録されています', '');
    } else if (r.action === '入室') {
      chime(true);
      show('in', 'ようこそ！', r.name + 'さん', '入室 ' + r.time, r.notifyFailed ? '※記録はできましたが、通知を送れませんでした' : 'おうちの人に知らせたよ');
    } else {
      chime(false);
      show('out', 'おつかれさま！', r.name + 'さん', '退室 ' + r.time, r.notifyFailed ? '※記録はできましたが、通知を送れませんでした' : '気をつけて帰ってね');
    }
    setTimeout(reset, 3500);
  }

  function show(kind, msg, name, meta, note, spinning){
    var o = document.getElementById('overlay');
    o.className = 'overlay show ' + kind;
    document.getElementById('spinner').hidden = !spinning;
    document.getElementById('oMsg').textContent = msg;
    document.getElementById('oName').textContent = name;
    document.getElementById('oMeta').textContent = meta;
    document.getElementById('oNote').textContent = note;
  }
  function reset(){
    document.getElementById('overlay').className = 'overlay';
    busy = false;
  }

  // ===== おうちの人へのメッセージ =====
  var msgMode = false, msgTimer = null, msgQr = '', msgName = '', msgTo = 'family';
  function msgStart(to){
    if (busy) return;
    msgMode = true; lastText = ''; msgTo = (to === 'seiwa' || to === 'kento') ? to : 'family';
    document.getElementById('msgBarText').textContent = (msgTo === 'seiwa' ? 'Seiwaに' : msgTo === 'kento' ? 'Kentoに' : 'おうちの人に') + 'メッセージを送る人のQRコードをかざしてね';
    document.getElementById('msgBar').classList.add('show');
    clearTimeout(msgTimer); msgTimer = setTimeout(msgEnd, 30000);
  }
  function msgEnd(){
    msgMode = false; clearTimeout(msgTimer);
    document.getElementById('msgBar').classList.remove('show');
  }
  function msgCode(text){
    var id = text.indexOf('SUBSC:') === 0 ? text.slice(6).trim() : '';
    if (!/^S\d+$/.test(id)) {
      busy = true; beep(220, .25);
      show('err', 'このカードでは送れません', '', '生徒のQRカードをかざしてね', '');
      setTimeout(reset, 2500);
      return;
    }
    clearTimeout(msgTimer);
    document.getElementById('msgBar').classList.remove('show');
    busy = true; beep(880, .12);
    var ent = ROSTER && ROSTER.s ? ROSTER.s[id] : null;
    msgQr = text; msgName = ent ? ent.name : '';
    document.getElementById('cTitle').textContent = (msgName ? msgName + 'さん' : 'このカードの生徒') + (msgTo === 'seiwa' ? 'から、Seiwaにメッセージを送ります' : msgTo === 'kento' ? 'から、Kentoにメッセージを送ります' : 'から、おうちの人にメッセージを送ります');
    var ta = document.getElementById('cText');
    ta.value = ''; msgCount();
    document.getElementById('compose').classList.add('show');
    setTimeout(function(){ ta.focus(); }, 100);
  }
  function msgCount(){
    var v = document.getElementById('cText').value;
    document.getElementById('cCount').textContent = v.length + ' / 300';
    document.getElementById('cSend').disabled = !v.trim();
  }
  function msgClose(){
    document.getElementById('compose').classList.remove('show');
    document.getElementById('cText').blur();
    msgEnd(); msgQr = ''; msgName = '';
  }
  function msgCancel(){ msgClose(); lastText = ''; reset(); }
  function msgSend(){
    var body = document.getElementById('cText').value.trim();
    if (!body) return;
    var qr = msgQr, name = msgName, to = msgTo;
    msgClose();
    show('wait', '送信中…', '', '', '', true);
    fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'kiosk_msg', key:KEY, qr:qr, text:body, to:to }) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        if (r && r.ok) {
          chime(true);
          show('in', '送りました', (r.name || name) + 'さん', to === 'seiwa' ? 'Seiwaに届けました' : to === 'kento' ? 'Kentoに届けました' : (r.noParent ? '教室の先生に届けました' : 'おうちの人に届けました'), r.noParent ? '※おうちの人のLINE登録がまだのため、先生だけに届いています' : '');
        } else {
          beep(220, .3);
          show('err', (r && r.message) || '送れませんでした', '', '先生に声をかけてください', '');
        }
        lastText = ''; setTimeout(reset, 3500);
      })
      .catch(function(){
        beep(220, .3);
        show('err', '通信できませんでした', '', 'もう一度ためしてください', '');
        lastText = ''; setTimeout(reset, 3000);
      });
  }
  document.getElementById('msgBtn').onclick = function(){ msgStart('family'); };
  document.getElementById('msgBtnS').onclick = function(){ msgStart('seiwa'); };
  document.getElementById('msgBtnK').onclick = function(){ msgStart('kento'); };
  document.getElementById('msgBarCancel').onclick = msgEnd;
  document.getElementById('cCancel').onclick = msgCancel;
  document.getElementById('cSend').onclick = msgSend;
  document.getElementById('cText').addEventListener('input', msgCount);

  // ===== ゲストの入退室 =====
  var GUEST_CATS = ['体験生', '休会生', 'ビジター', 'メンター', '保護者', 'その他'];
  var G = null, guestMode = false, gTimer = null, gIdle = null;
  var GNOTE = '※休会生・ビジターは30分以上の滞在で有料になります';
  function gEsc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function gPanel(html){ var p = document.getElementById('gPanel'); p.innerHTML = html; p.classList.add('show'); clearTimeout(gIdle); gIdle = setTimeout(guestCancel, 90000); }
  function gClose(){ document.getElementById('gPanel').classList.remove('show'); clearTimeout(gIdle); var a = document.activeElement; if (a && a.blur) a.blur(); }
  function guestCancel(){ gClose(); guestEnd(); G = null; busy = false; lastText = ''; }
  function guestStart(){
    if (busy && !G) return;
    busy = true; G = { act: '', cat: '', name: '', gid: '' };
    gPanel('<h2>ゲストの方の受付</h2><p class="gnote">入室ですか？退室ですか？</p>'
      + '<div class="ggrid two"><button type="button" class="in" data-act="in">入室</button><button type="button" class="out" data-act="out">退室</button></div>'
      + '<p class="gnote">' + GNOTE + '</p><div class="row"><button type="button" data-cancel>やめる</button></div>');
  }
  function guestCats(){
    gPanel('<h2>' + (G.act === 'in' ? '入室' : '退室') + '：あてはまるものを選んでね</h2>'
      + '<div class="ggrid">' + GUEST_CATS.map(function(c){ return '<button type="button" data-cat="' + c + '">' + c + '</button>'; }).join('') + '</div>'
      + '<div class="row"><button type="button" data-back="act">もどる</button><button type="button" data-cancel>やめる</button></div>');
  }
  function guestName(){
    gPanel('<h2>' + gEsc(G.cat) + '：お名前を入力してください</h2>'
      + '<input id="gName" maxlength="20" placeholder="例：山田 花子" autocomplete="off">'
      + '<div class="row"><button type="button" data-back="cat">もどる</button><button type="button" data-cancel>やめる</button><button type="button" class="next" id="gNext" disabled>次へ</button></div>');
    var inp = document.getElementById('gName');
    inp.value = G.name || ''; document.getElementById('gNext').disabled = !inp.value.trim();
    inp.addEventListener('input', function(){ document.getElementById('gNext').disabled = !inp.value.trim(); clearTimeout(gIdle); gIdle = setTimeout(guestCancel, 90000); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter' && inp.value.trim()) guestToCamera(); });
    setTimeout(function(){ inp.focus(); }, 100);
  }
  function guestOutList(){
    gPanel('<h2>退室：お名前を選んでね</h2><div class="glist" id="gList"><p class="gnote">読み込み中…</p></div>'
      + '<div class="row"><button type="button" data-back="act">もどる</button><button type="button" data-cancel>やめる</button></div>');
    fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'kiosk_guest_list', key:KEY }) })
      .then(function(r){ return r.json(); })
      .then(function(r){
        var list = (r && r.ok && r.list) || [];
        var el = document.getElementById('gList'); if (!el) return;
        el.innerHTML = list.map(function(x){ return '<button type="button" data-gid="' + gEsc(x.id) + '" data-name="' + gEsc(x.name) + '" data-gcat="' + gEsc(x.cat) + '">' + gEsc(x.name) + 'さん<small>' + gEsc(x.cat) + '・' + gEsc(x.in) + '入室</small></button>'; }).join('')
          + '<button type="button" data-notlisted style="text-align:center;background:var(--paper)">一覧に名前がない</button>';
      })
      .catch(function(){ var el = document.getElementById('gList'); if (el) el.innerHTML = '<button type="button" data-notlisted style="text-align:center">名前を入力して退室する</button>'; });
  }
  function guestToCamera(){
    var inp = document.getElementById('gName'); if (inp) G.name = inp.value.trim();
    if (!G.name) return;
    gClose();
    document.getElementById('gBarTitle').textContent = G.name + 'さん：顔が見えるように写真に写ってください';
    document.getElementById('gBar').classList.add('show');
    guestMode = true; busy = false; lastText = '';
    clearTimeout(gTimer); gTimer = setTimeout(guestCancel, 60000);
  }
  function guestEnd(){ guestMode = false; clearTimeout(gTimer); document.getElementById('gBar').classList.remove('show'); }
  function guestCode(text){
    if (text.trim() !== 'SUBSC:GUEST') {
      busy = true; beep(220, .25);
      show('err', 'ゲスト用のQRコードをかざしてね', '', '教室にあるゲスト用のQRコードを使ってね', '');
      setTimeout(function(){ document.getElementById('overlay').className = 'overlay'; busy = false; lastText = ''; }, 2500);
      return;
    }
    clearTimeout(gTimer);
    document.getElementById('gBar').classList.remove('show');
    busy = true; beep(880, .12);
    show('wait', 'そのまま カメラを見てね', '', '', '', true);
    var g = G;
    setTimeout(function(){
      var photo = capture();
      document.getElementById('oMsg').textContent = '送信中…';
      fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'kiosk_guest', key:KEY, act:g.act, cat:g.cat, name:g.name, gid:g.gid, photo:photo }) })
        .then(function(r){ return r.json(); })
        .then(function(r){
          guestMode = false; G = null;
          if (!r || !r.ok) { beep(220, .3); show('err', (r && r.message) || '受付できませんでした', '', '先生に声をかけてください', ''); }
          else {
            chime(r.act === '入室');
            var note = GNOTE;
            if (r.act === '退室' && r.min != null) note = '滞在 ' + (r.min >= 60 ? Math.floor(r.min / 60) + '時間' : '') + (r.min % 60) + '分' + (r.charged ? '（有料になります。お支払いは先生へ）' : '') + '\n' + GNOTE;
            show(r.act === '入室' ? 'in' : 'out', r.name + 'さんが' + r.act + 'しました', '', (r.cat ? r.cat + '　' : '') + r.act + ' ' + r.time, note);
          }
          lastText = ''; setTimeout(reset, 4500);
        })
        .catch(function(){ guestMode = false; G = null; beep(220, .3); show('err', '通信できませんでした', '', 'もう一度ためしてください', ''); lastText = ''; setTimeout(reset, 3000); });
    }, 1400);
  }
  document.getElementById('guestBtn').onclick = guestStart;
  document.getElementById('gBarCancel').onclick = guestCancel;
  document.getElementById('gPanel').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b || !G) return;
    if (b.hasAttribute('data-cancel')) return guestCancel();
    if (b.dataset.act) { G.act = b.dataset.act; G.gid = ''; G.cat = ''; G.name = ''; return G.act === 'out' ? guestOutList() : guestCats(); }
    if (b.dataset.back === 'act') return guestStart();
    if (b.dataset.back === 'cat') return guestCats();
    if (b.dataset.cat) { G.cat = b.dataset.cat; return guestName(); }
    if (b.dataset.gid) { G.gid = b.dataset.gid; G.name = b.dataset.name; G.cat = b.dataset.gcat; return guestToCamera(); }
    if (b.hasAttribute('data-notlisted')) { G.gid = ''; return guestCats(); }
    if (b.id === 'gNext') return guestToCamera();
  });

  // ===== 教室からのメッセージ・カウントダウン =====
  var BOARD = null;
  function loadBoard(){
    if (!KEY) return;
    fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'kiosk_board', key:KEY }) })
      .then(function(r){ return r.json(); })
      .then(function(r){ if (r && r.ok) { BOARD = r; renderBoard(); } })
      .catch(function(){});
  }
  function renderBoard(){
    if (!BOARD) return;
    var bd = document.getElementById('board');
    document.getElementById('boardText').textContent = BOARD.message || '本日は特別なメッセージはありません';
    bd.classList.toggle('none', !BOARD.message);
    var now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var html = '';
    (BOARD.cd || []).forEach(function(c){
      if (!c || !c.label || !/^\d{4}-\d{2}-\d{2}$/.test(c.date)) return;
      var p = c.date.split('-').map(Number);
      var days = Math.round((Date.UTC(p[0], p[1] - 1, p[2]) - today) / 86400000);
      if (days < 0) return;
      var e = document.createElement('div'); e.textContent = c.label;
      html += '<div class="cd"><span class="lb">' + e.innerHTML + 'まで</span><span class="dd">あと<b>' + days + '</b>日</span></div>';
    });
    document.getElementById('cds').innerHTML = html;
  }
  loadBoard();
  setInterval(loadBoard, 5 * 60 * 1000);
  setInterval(renderBoard, 60 * 1000);

  // 効果音
  var actx = null;
  function beep(freq, dur, delay){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t = actx.currentTime + (delay || 0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.3, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + .05);
    } catch(e){}
  }
  function chime(isIn){
    if (isIn) { beep(784, .18); beep(1047, .3, .16); }
    else { beep(1047, .18); beep(784, .3, .16); }
  }
</script>
