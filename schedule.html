<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンター在室・行事｜みんなのサブスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .days{margin-top:16px}
  .d{display:grid;grid-template-columns:5.2em 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .d:last-child{border-bottom:0}
  .d .dt{font-weight:900;font-size:17px;line-height:1.3}
  .d .dt small{display:block;font-size:12px;color:var(--sub);font-weight:700}
  .d.today .dt{color:var(--ink)}
  .d.today .dt small{color:var(--ink)}
  .d .sun{color:#B3261E}.d .sat{color:#185FA5}
  .line{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .line + .line{margin-top:4px}
  .k{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:0 10px}
  .k.m{background:var(--tint)}
  .k.e{background:#E8EEF8;color:#28497A}
  .tm{font-weight:900;font-variant-numeric:tabular-nums}
  .none{color:var(--sub);font-size:14px}
  .loading{color:var(--sub);padding:24px 0}
  .nowbox{margin-top:16px;background:var(--tint);border-radius:16px;padding:14px 16px}
  .nowbox:empty{display:none}
  .nowt{font-weight:900;font-size:14px}
  .nowt small{font-weight:500;color:var(--sub);margin-left:8px;font-size:12px}
  .nowr{font-weight:700;margin-top:2px}
  .nowr .big{font-size:32px;font-weight:900;margin-right:4px;font-variant-numeric:tabular-nums}
  .nowm{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .mt{font-size:13px;font-weight:700;border-radius:999px;padding:2px 12px;background:#fff;color:var(--sub)}
  .mt.on{background:#0F6E56;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs"><a href="annai.html">運営案内</a><a href="ryokin.html">料金表</a><a href="schedule.html" aria-current="page">在室・行事</a></nav>
  <header>
    <div class="brand">みんなのサブスク</div>
    <h1>メンター在室・行事</h1>
    <p class="lead">今日から2週間の、メンターがいる時間と行事の予定です。予定は変わることがあります。</p>
  </header>
  <div class="nowbox" id="now"></div>
  <div class="days" id="days"><p class="loading">読み込み中…</p></div>
  <div class="box">
    <h3>メンターがいない時間</h3>
    <p>メンターがいない時間も、自習室はご利用いただけます。教室内は監視カメラで見守っています。</p>
  </div>
  <p class="note">個別授業のご相談は公式LINEからどうぞ。</p>
  <footer>みんなのサブスク　石川県かほく市宇野気62-1 江川ビル2階</footer>
</div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwoPiOpPmUcykIrgUGYj5f0z1jnPA6gH3cU2aUDsqSLVKlAB9CytbtpYb8iqHAS81kQ-g/exec';
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function renderNow(n){
    var el = document.getElementById('now'); if (!el || !n) return;
    el.innerHTML = '<div class="nowt">いまの教室<small>' + esc(n.at) + ' 現在</small></div>'
      + '<div class="nowr"><span class="big">' + n.students + '</span>人が在室中</div>'
      + '<div class="nowm">' + n.mentors.map(function(m){ return '<span class="mt' + (m.in ? ' on' : '') + '">' + esc(m.name) + (m.in ? '　出勤中' : '　不在') + '</span>'; }).join('') + '</div>';
  }
  function load(){
  return fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'sch_public' }) })
    .then(function(r){ return r.json(); })
    .then(function(r){
      if (!r.ok) throw new Error();
      renderNow(r.now);
      document.getElementById('days').innerHTML = r.days.map(function(d){
        var p = d.date.split('-');
        var cls = d.wd === '日' ? 'sun' : d.wd === '土' ? 'sat' : '';
        var lines = '';
        if (d.presence.length) lines += '<div class="line"><span class="k m">メンター</span><span class="tm">' + d.presence.map(function(x){ return x[0] + '〜' + x[1]; }).join('、') + '</span></div>';
        d.events.forEach(function(e){ lines += '<div class="line"><span class="k e">行事</span><span><span class="tm">' + e.start + '〜' + e.end + '</span>　' + esc(e.name) + '</span></div>'; });
        if (!lines) lines = '<div class="none">メンターの在室予定はまだありません</div>';
        return '<div class="d' + (d.date === r.today ? ' today' : '') + '"><div class="dt ' + cls + '">' + (+p[1]) + '/' + (+p[2]) + '<small>' + d.wd + '曜' + (d.date === r.today ? '・今日' : '') + '</small></div><div>' + lines + '</div></div>';
      }).join('');
    })
    .catch(function(){ document.getElementById('days').innerHTML = '<p class="none">予定を読み込めませんでした。時間をおいて開き直してください。</p>'; });
  }
  load();
  setInterval(load, 60000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
